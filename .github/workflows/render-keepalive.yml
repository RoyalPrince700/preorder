name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        env:
          RENDER_URL: https://preorder-g9ne.onrender.com
        run: curl --fail --silent --show-error --max-time 30 "$RENDER_URL"
